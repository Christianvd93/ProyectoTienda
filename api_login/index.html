<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Login Floral</title>

<link
rel="stylesheet"
href="css/estilos.css">

</head>

<body>

<div class="contenedor">

    <h1>🌸 Iniciar Sesión</h1>

    <!-- USUARIO -->
    <input
    type="text"
    id="usuarioLogin"
    placeholder="Ingrese usuario">

    <!-- PASSWORD -->
    <input
    type="password"
    id="passwordLogin"
    placeholder="Ingrese contraseña">

    <!-- INGRESAR -->
    <button
    class="btn-login"
    onclick="login()">

        Ingresar

    </button>

    <!-- REGISTRARSE -->
    <button
    class="btn-registro"
    onclick="irRegistro()">

        Registrarse

    </button>

    <!-- MENSAJES -->
    <div
    id="mensajeLogin"
    class="mensaje"></div>

</div>

<script src="js/app.js"></script>

</body>
</html>
